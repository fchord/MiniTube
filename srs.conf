# MiniTube 直播 Origin（SRS）。
# HLS 落盘后由 API 拷贝到 data/live-hls；SRS 不删文件（hls_cleanup off / hls_dispose 0）。
# 停掉本容器仍可能清掉 /data/srs-hls，归档以 API 目录为准。

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             /data/srs-hls;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;

    hls {
        enabled             on;
        hls_path            /data/srs-hls;
        hls_fragment        2;
        hls_window          86400;
        hls_wait_keyframe   on;
        hls_cleanup         off;
        hls_dispose         0;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_on_error        continue;
    }

    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8080/v1/internal/srs/on_publish?secret=dev-srs-hook;
        on_unpublish    http://host.docker.internal:8080/v1/internal/srs/on_unpublish?secret=dev-srs-hook;
        on_hls          http://host.docker.internal:8080/v1/internal/srs/on_hls?secret=dev-srs-hook;
    }
}
