<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>直播 · MiniTube</title>
  <link rel="stylesheet" href="/static/account.css"/>
  <link rel="stylesheet" href="/static/player.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script src="/static/token.js"></script>
  <script src="/static/media-edge.js"></script>
  <script src="/static/player.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    header { padding: 12px 16px; background: #1a1a1a; }
    header a { color: #8ab4ff; text-decoration: none; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      main { padding: 0 0 16px; gap: 12px; }
      h1 { padding: 12px 16px 0; margin: 0; }
      .meta, .err, #vod { padding: 0 16px; }
      #likeBtn { margin-left: 16px; }
      .chat { margin: 0 16px; }
    }
    h1 { font-size: 1.2rem; }
    .meta { color: #aaa; font-size: .9rem; }
    .err { color: #f88; }
    .chat { background: #1a1a1a; border-radius: 8px; display: flex; flex-direction: column; height: 70vh; min-height: 280px; }
    .msgs { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .msg { margin: 6px 0; }
    .msg .u { color: #8ab4ff; font-size: .8rem; }
    form { display: flex; gap: 8px; padding: 8px; }
    form input { flex: 1; background: #111; color: #eee; border: 1px solid #333; padding: 8px; border-radius: 6px; }
    form button, #likeBtn { background: #3b6; color: #111; border: 0; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="/">MiniTube</a> · <a href="/live">直播</a> · <a href="/shorts">短视频</a> · <a href="/compose">发帖</a> · <a href="/feed">时间线</a></header>
  <main>
    <section>
      <div id="player"></div>
      <h1 id="title">加载中…</h1>
      <p class="meta" id="meta"></p>
      <button id="likeBtn" type="button" hidden>赞</button>
      <p id="vod"></p>
      <p class="err" id="err"></p>
    </section>
    <aside class="chat">
      <div class="msgs" id="msgs"></div>
      <form id="cmtForm">
        <input id="cmtBody" maxlength="2000" placeholder="发条弹幕/评论" autocomplete="off"/>
        <button type="submit">发送</button>
      </form>
    </aside>
  </main>
  <script>
    const SLOT = "__SLOT__";
    const API = location.origin;
    const PROG_KEY = "mt.liveProgress." + SLOT;
    const errEl = document.getElementById("err");
    const msgs = document.getElementById("msgs");
    const mt = window.mtPlayer.mount(document.getElementById("player"));
    function token() { return window.mtAuth.getToken(); }
    function headers(json) {
      const h = {};
      if (json) h["Content-Type"] = "application/json";
      if (token()) h.Authorization = "Bearer " + token();
      return h;
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function addMsg(c) {
      msgs.insertAdjacentHTML("beforeend", `<div class="msg"><span class="u">${esc(c.user && c.user.username)}</span><div></div></div>`);
      msgs.lastElementChild.lastElementChild.textContent = c.body;
      msgs.scrollTop = msgs.scrollHeight;
    }
    function updateMeta(live) {
      document.getElementById("meta").innerHTML =
        (live.channel ? `<a href="/c/${esc(live.channel.handle)}">@${esc(live.channel.handle)}</a>` : "") +
        ` · ${esc(live.status)} · ${esc(live.likeCount || 0)} 赞`;
    }
    function showVod(id) {
      if (!id) return;
      document.getElementById("vod").innerHTML = `<a href="/watch/${esc(id)}">观看录播</a>`;
    }
    function savedProgress() {
      const n = parseFloat(sessionStorage.getItem(PROG_KEY) || "");
      return Number.isFinite(n) && n > 1 ? n : 0;
    }
    let lastSaved = 0;
    function saveProgress(t) {
      if (!(t > 1) || Math.abs(t - lastSaved) < 1) return;
      lastSaved = t;
      sessionStorage.setItem(PROG_KEY, String(t));
    }
    function hlsUrl(live) {
      const url = API + "/v1/live/" + encodeURIComponent(SLOT) + "/hls/index.m3u8";
      return window.mtMedia && window.mtMedia.rewrite ? window.mtMedia.rewrite(url) : url;
    }
    function attach(url, asVod) {
      if (!url) return;
      mt.load({
        src: url,
        live: !asVod,
        autoplay: true,
        startAt: savedProgress(),
        onTimeupdate: saveProgress,
        onHlsError: function (data) {
          const code = data && data.response && data.response.code;
          if (code !== 404) return false;
          fetch(API + "/v1/live/" + encodeURIComponent(SLOT), { headers: headers() }).then(function (r) {
            return r.ok ? r.json() : null;
          }).then(function (now) {
            if (now && now.status === "ended") onLiveEnded(now);
            else mt.retryLoad();
          }).catch(function () { mt.retryLoad(); });
          return true;
        }
      });
    }
    async function onLiveEnded(extra) {
      showVod(extra && extra.vodVideoId);
      const live = await fetch(API + "/v1/live/" + encodeURIComponent(SLOT), { headers: headers() }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (live) {
        updateMeta(live);
        showVod(live.vodVideoId);
      }
      errEl.textContent = "直播已结束，可拖动进度回看";
      mt.setLive(false);
      attach(hlsUrl(live || extra), true);
    }
    async function main() {
      if (window.mtMedia && window.mtMedia.ready) await window.mtMedia.ready();
      const live = await fetch(API + "/v1/live/" + encodeURIComponent(SLOT), { headers: headers() }).then(r => {
        if (!r.ok) throw new Error("直播不存在");
        return r.json();
      });
      document.getElementById("title").textContent = live.title || "直播";
      document.title = (live.title || "直播") + " · MiniTube";
      updateMeta(live);
      showVod(live.vodVideoId);
      if (token()) {
        const btn = document.getElementById("likeBtn");
        btn.hidden = false;
        btn.textContent = live.liked ? "已赞" : "赞";
        btn.addEventListener("click", async () => {
          const liked = btn.textContent === "已赞";
          await fetch(API + "/v1/live/" + SLOT + "/like", { method: liked ? "DELETE" : "POST", headers: headers() });
          btn.textContent = liked ? "赞" : "已赞";
        });
      }
      if (live.status === "live" || (live.status === "ended" && live.playbackUrl)) {
        if (live.status === "ended") errEl.textContent = "直播已结束，可拖动进度回看";
        attach(hlsUrl(live), live.status === "ended");
      } else if (live.status === "ended") {
        errEl.textContent = "直播已结束";
      } else {
        errEl.textContent = "尚未开播。用 OBS / ffmpeg 推流到创建时返回的 rtmp://主机:1935/live/{密钥}";
        const wait = setInterval(async () => {
          const now = await fetch(API + "/v1/live/" + encodeURIComponent(SLOT), { headers: headers() }).then(r => r.ok ? r.json() : null).catch(() => null);
          if (now && now.status === "live") {
            clearInterval(wait);
            errEl.textContent = "";
            updateMeta(now);
            attach(hlsUrl(now), false);
          }
        }, 3000);
      }
      if (live.status !== "ended") {
        const poll = setInterval(async () => {
          const now = await fetch(API + "/v1/live/" + encodeURIComponent(SLOT), { headers: headers() }).then(r => r.ok ? r.json() : null).catch(() => null);
          if (now && now.status === "ended") { clearInterval(poll); onLiveEnded(now); }
        }, 4000);
      }
      const hist = await fetch(API + "/v1/live/" + SLOT + "/comments?limit=50").then(r => r.json());
      (hist.items || []).forEach(addMsg);
      const es = new EventSource(API + "/v1/live/" + SLOT + "/chat/stream");
      es.onmessage = (ev) => {
        try {
          const m = JSON.parse(ev.data);
          if (m && m.type === "status" && m.status === "ended") { onLiveEnded(m); return; }
          addMsg(m);
        } catch {}
      };
      document.getElementById("cmtForm").addEventListener("submit", async e => {
        e.preventDefault();
        if (!token()) { errEl.textContent = "登录后才能发言"; return; }
        const body = document.getElementById("cmtBody").value;
        const r = await fetch(API + "/v1/live/" + SLOT + "/comments", { method: "POST", headers: headers(true), body: JSON.stringify({ body }) });
        if (!r.ok) { errEl.textContent = (await r.json().catch(()=>({}))).message || "发送失败"; return; }
        document.getElementById("cmtBody").value = "";
      });
    }
    main().catch(e => { errEl.textContent = e.message; });
  </script>
  <script src="/static/account.js"></script>
</body>
</html>
