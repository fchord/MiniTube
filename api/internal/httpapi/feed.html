<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>时间线 · MiniTube</title>
  <link rel="stylesheet" href="/static/post-media.css"/>
  <link rel="stylesheet" href="/static/account.css"/>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    header { padding: 12px 16px; background: #1a1a1a; }
    header a { color: #8ab4ff; text-decoration: none; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #1a1a1a; padding: 12px 16px; margin: 12px 0; border-radius: 8px; }
    .meta { color: #aaa; font-size: .85rem; }
    .err { color: #f88; }
    label, input, button { display: block; width: 100%; margin: 8px 0; box-sizing: border-box; }
    input { background: #1a1a1a; color: #eee; border: 1px solid #333; padding: 8px; border-radius: 6px; }
    button { background: #3b6; color: #111; border: 0; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="/">MiniTube</a> · <a href="/live">直播</a> · <a href="/shorts">短视频</a> · <a href="/compose">发帖</a> · <a href="/feed">时间线</a></header>
  <main>
    <h1>订阅频道的帖子</h1>
    <form id="login">
      <input id="ident" placeholder="用户名或邮箱" autocomplete="username"/>
      <input id="pass" type="password" placeholder="密码" autocomplete="current-password"/>
      <button type="submit">登录</button>
    </form>
    <div id="list"></div>
    <p class="err" id="err"></p>
  </main>
  <script src="/static/post-media.js"></script>
  <script>
    const API = location.origin;
    const errEl = document.getElementById("err");
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function token() { return window.mtAuth.getToken(); }
    async function api(method, path, body, tok) {
      const headers = { "Content-Type": "application/json" };
      if (tok) headers.Authorization = "Bearer " + tok;
      const r = await fetch(API + path, { method, headers, body: body == null ? undefined : JSON.stringify(body) });
      const text = await r.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch {}
      if (!r.ok) throw new Error(data.message || ("HTTP " + r.status));
      return data;
    }
    function card(p) {
      const ch = p.channel ? ` · @${esc(p.channel.handle)}` : "";
      return `<article class="card"><div class="meta"><a href="/u/${esc(p.author.username)}">${esc(p.author.nickname || p.author.username)}</a>${ch} · <a href="/post/${esc(p.id)}">打开</a></div><p>${esc(p.body)}</p>${renderPostImages(p.imageUrls)}</article>`;
    }
    async function loadFeed(tok) {
      document.getElementById("login").hidden = true;
      const data = await api("GET", "/v1/feed/posts", null, tok);
      const list = document.getElementById("list");
      list.innerHTML = "";
      const items = data.items || [];
      if (!items.length) {
        list.innerHTML = "<p class=\"meta\">还没有订阅频道的帖子。</p>";
        return;
      }
      items.forEach(p => list.insertAdjacentHTML("beforeend", card(p)));
    }
    document.getElementById("login").addEventListener("submit", async e => {
      e.preventDefault();
      errEl.textContent = "";
      try {
        const res = await api("POST", "/v1/auth/login", {
          identifier: document.getElementById("ident").value,
          password: document.getElementById("pass").value
        });
        window.mtAuth.setToken(res.accessToken);
        await loadFeed(res.accessToken);
      } catch (err) { errEl.textContent = err.message; }
    });
    if (token()) loadFeed(token()).catch(e => { errEl.textContent = e.message; });
  </script>
  <script src="/static/account.js"></script>
</body>
</html>
