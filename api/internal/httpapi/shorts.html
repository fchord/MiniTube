      const slide = slideEl(activeId);
      if (!slide) return;
      const hud = slide.querySelector(".hud-audio");
      if (hud) hud.innerHTML = muted ? ICONS.mute : ICONS.vol;
      slide.classList.add("is-hud-audio");
      clearTimeout(muteHudTimer);
      muteHudTimer = setTimeout(function () { slide.classList.remove("is-hud-audio"); }, 800);
    }
    function togglePlayback(id) {
      id = id || activeId;
      if (!id) return;
      if (MODE === "webcodecs" && wc) wc.toggle();
      else {
        const v = videoEl(id);
        if (!v) return;
        if (v.paused) playSafe(v);
        else v.pause();
      }
      showChrome(id, 800);
    }
    function clipDurationSec(id) {
      const it = items.find(function (x) { return x.id === id; });
      const ms = Number(it && it.durationMs) || 0;
      return ms > 50 ? ms / 1000 : 0;
    }
    function progressPct(id) {
      const dur = clipDurationSec(id);
      if (!(dur > 0)) return 0;
      let t = 0;
      if (MODE === "webcodecs" && wc && wc.mediaTime) t = Number(wc.mediaTime()) || 0;
      else {
        const v = videoEl(id);
        t = v ? Number(v.currentTime) || 0 : 0;
      }
      if (!(t >= 0)) t = 0;
      const m = t % dur;
      return Math.min(1, Math.max(0, m / dur));
    }
    function updateProgress() {
      if (!activeId) return;
      const slide = slideEl(activeId);
      const bar = slide && slide.querySelector(".scrub-play");
      if (!bar) return;
      bar.style.width = (progressPct(activeId) * 100).toFixed(2) + "%";
    }
    function tickProgress() {
      progRaf = requestAnimationFrame(tickProgress);
      updateProgress();
    }
    function syncMuteButtons() {
      const label = muted ? "打开声音" : "静音";
      document.querySelectorAll(".mute").forEach(function (btn) {
        if (btn.getAttribute("aria-label") === label) return;
        btn.innerHTML = muted ? ICONS.mute : ICONS.vol;
        btn.setAttribute("aria-label", label);
      });
      document.querySelectorAll(".slide video").forEach(function (v) {
        const slide = v.closest(".slide");
        const id = slide && slide.dataset.id;
        v.muted = muted || id !== activeId;
      });
    }
    function toggleMute() {
      muted = !muted;
      if (wc) {
        wc.unlockAudio();
        wc.setMuted(muted);
      } else {
        syncMuteButtons();
        const v = activeId ? videoEl(activeId) : null;
        if (v && !v.paused && !muted) playSafe(v);
      }
      syncMuteButtons();
    }
    function queueUrl(id) {
      let u = "/shorts/" + encodeURIComponent(id);
      if (CHANNEL) u += "?ch=" + encodeURIComponent(CHANNEL);
      return u;
    }
    async function activate(id) {
      if (!id) return;
      const tok = ++actGen;
      if (activeId === id) {
        await ensureWindow();
        return;
      }
      if (activeId && activeId !== id) {
        if (MODE !== "webcodecs") {
          const prev = videoEl(activeId);
          if (prev) {
            prev._t = prev.currentTime || prev._t || 0;
            prev.pause();
            prev.muted = true;
            setSlideUi(activeId);
            hideChrome(activeId);
          }
        } else {
          hideChrome(activeId);
        }
      }
      document.querySelectorAll(".slide video").forEach(function (v) {
        const slide = v.closest(".slide");
        const sid = slide && slide.dataset.id;
        if (sid !== id) {
          v.pause();
          v.muted = true;
        }
      });
      if (MODE === "webcodecs" && wc) wc.activate(id);
      activeId = id;
      history.replaceState(null, "", queueUrl(id));
      await ensureAhead();
      if (tok !== actGen) return;
      await ensureWindow();
      if (tok !== actGen) return;
      if (MODE === "webcodecs") {
        setSlideUi(id);
        return;
      }
      const video = videoEl(id);
      if (!video) return;
      video.muted = muted;
      video.loop = true;
      try {
        if (video._t > 0.4 && Math.abs((video.currentTime || 0) - video._t) > 0.5) {
          video.currentTime = video._t;
        }
        await playSafe(video);
      } catch (e) {
        if (isAbortErr(e) || tok !== actGen) return;
        video.muted = true;
        try { await playSafe(video); } catch (e2) {
          if (!isAbortErr(e2)) errEl.textContent = e2.message || "无法播放";
        }
      }
      if (tok !== actGen) return;
      setSlideUi(id);
    }
    function goTo(id, dir) {
      if (!slideEl(id)) return;
      if (!dir || id === activeId) {
        activate(id);
        layoutNow();
        return;
      }
      if (sliding) {
        pendingDir = dir;
        return;
      }
      sliding = true;
      slideDir = dir > 0 ? 1 : -1;
      baseIdx = Math.max(0, idxOf(activeId));
      slog("slide-start", dir > 0 ? "down" : "up", "fromSeq=" + baseIdx, "from=" + activeId, "toSeq=" + idxOf(id), "to=" + id);
      if (MODE === "webcodecs" && wc) {
        const tIdle = performance.now();
        wc.presentIdle(id, true);
        slog("idle-cost", (performance.now() - tIdle).toFixed(1) + "ms", "id=" + id);
      }
      animateShift(0, slideDir, SLIDE_KEY_MS, easeInOutPoly);
      ensureWindow();
    }
    function step(dir) {
      const idx = idxOf(activeId);
      slog("key", dir > 0 ? "down" : "up", "fromSeq=" + idx, "from=" + activeId);
      if (idx < 0) return;
      if (sliding) { pendingDir = dir; return; }
      let n = wrapIdx(idx + dir);
      if (n < 0) {
        if (dir > 0) {
          ensureAhead().then(function () {
            n = wrapIdx(idx + dir);
            if (n < 0 && items.length > 1 && exhausted) {
              circular = true;
              n = wrapIdx(idx + dir);
            }
            if (n >= 0) goTo(items[n].id, dir);
          });
        } else if (items.length > 1 && exhausted) {
          circular = true;
          n = wrapIdx(idx + dir);
          if (n >= 0) goTo(items[n].id, dir);
        }
        return;
      }
      goTo(items[n].id, dir);
    }
    function slideHTML(v) {
      const stage = MODE === "webcodecs"
        ? `<canvas class="stage" aria-hidden="true"></canvas>`
        : `<video playsinline loop muted poster="${esc(v.thumbnailUrl || "")}"></video>`;
      return `<section class="slide" data-id="${esc(v.id)}" id="s-${esc(v.id)}">
        <div class="stage-box">
          ${stage}
          <button type="button" class="bigplay" aria-label="播放">${ICONS.play}</button>
          <div class="hud-audio" aria-hidden="true"></div>
          <div class="scrub" aria-hidden="true"><i class="scrub-play"></i></div>
          <div class="overlay">
            <p class="title">${esc(v.title || "未命名")}</p>
            <p class="meta">${v.channel ? `<a href="/c/${esc(v.channel.handle)}">@${esc(v.channel.handle)}</a>` : ""}</p>
            <p class="likecount" data-n="${esc(v.likeCount || 0)}">${esc(v.likeCount || 0)} 赞</p>
          </div>
          <div class="side">
            <button type="button" class="mute" aria-label="打开声音">${ICONS.mute}</button>
            <button type="button" class="like" data-id="${esc(v.id)}">${v.liked ? "已赞" : "赞"}</button>
          </div>
        </div>
      </section>`;
    }
    function append(list) {
      const fresh = [];
      (list || []).forEach(v => {
        if (!v || !v.id || seen.has(v.id)) return;
        seen.add(v.id);
        items.push(v);
        fresh.push(v);
        feedEl.insertAdjacentHTML("beforeend", slideHTML(v));
        setSlidePos(v.id, 2);
      });
      syncMuteButtons();
      if (activeId && !sliding) layoutNow();
      else if (!activeId) applyTransforms(0, 0);
      return fresh.length;
    }
    async function loadRandomPage() {
      if (loading || exhausted || CHANNEL) return 0;
      loading = true;
      try {
        const exclude = encodeURIComponent([...seen].join(","));
        const data = await getJSON("/v1/feed/shorts?random=1&limit=8&exclude=" + exclude);
        const n = append(data.items || []);
        if (!data.nextCursor || n < 1) exhausted = true;
        if (exhausted && items.length > 1) circular = true;
        return n;
      } catch (e) {
        errEl.textContent = e.message;
        return 0;
      } finally {
        loading = false;
      }
    }
    async function ensureAhead() {
      if (CHANNEL || circular) return;
      const idx = idxOf(activeId);
      if (idx < 0) return;
      while (!exhausted && items.length - idx - 1 < fwdK) {
        const n = await loadRandomPage();
        if (n < 1) break;
      }
    }
    async function loadChannelQueue() {
      const data = await getJSON("/v1/channels/" + encodeURIComponent(CHANNEL) + "/videos?kind=short&limit=50");
      const list = data.items || [];
      if (START) {
        const hit = list.find(v => v.id === START);
        if (hit) {
          append(list);
        } else {
          const cur = await getJSON("/v1/videos/" + encodeURIComponent(START));
          append([cur].concat(list));
        }
      } else {
        append(list);
      }
      circular = items.length > 1;
      exhausted = true;
    }

    feedEl.addEventListener("click", async (e) => {
      if (ignoreClick) {
        ignoreClick = false;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      const hit = (e.target.closest && e.target.closest(".mute, .like, .bigplay")) || hitUiControl(e.clientX, e.clientY);
      const muteBtn = hit && hit.closest ? hit.closest(".mute") : null;
      const likeBtn = hit && hit.closest ? hit.closest(".like") : null;
      const big = hit && hit.closest ? hit.closest(".bigplay") : null;
      const slide = (e.target.closest && e.target.closest(".slide")) || slideEl(activeId);
      if (muteBtn) {
        e.stopPropagation();
        toggleMute();
        return;
      }
      if (likeBtn) {
        e.stopPropagation();
        const id = likeBtn.dataset.id;
        if (!token()) { errEl.textContent = "登录后才能点赞"; return; }
        try {
          const liked = likeBtn.textContent === "已赞";
          await fetch(API + "/v1/videos/" + id + "/like", { method: liked ? "DELETE" : "POST", headers: headers() });
          likeBtn.textContent = liked ? "赞" : "已赞";
          const slide = likeBtn.closest(".slide");
          const countEl = slide && slide.querySelector(".likecount");
          if (countEl) {
            let n = parseInt(countEl.getAttribute("data-n"), 10) || 0;
            n += liked ? -1 : 1;
            if (n < 0) n = 0;
            countEl.setAttribute("data-n", String(n));
            countEl.textContent = n + " 赞";
          }
        } catch (err) { errEl.textContent = err.message; }
        return;
      }
      if (big) {
        e.stopPropagation();
        togglePlayback(slide && slide.dataset.id);
        return;
      }
    });
    async function onPointerEnd(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      try { feedEl.releasePointerCapture(e.pointerId); } catch (err) {}
      if (!d.moved) {
        if (hitUiControl(e.clientX, e.clientY)) return;
        if (isCoarsePointer()) {
          const slide = slideEl(activeId);
          if (!slide) return;
          if (slide.classList.contains("is-chrome") && !slide.classList.contains("is-paused")) hideChrome(activeId);
          else showChrome(activeId, 2500);
        } else {
          if (!hitPicture(e.clientX, e.clientY)) return;
          togglePlayback(activeId);
        }
        return;
      }
      ignoreClick = true;
      setTimeout(function () { ignoreClick = false; }, 450);
      const vy = d.vy || 0;
      let target = 0;
      if (shift > 0.18 || (shift > 0.05 && vy < -0.35)) target = 1;
      else if (shift < -0.18 || (shift < -0.05 && vy > 0.35)) target = -1;
      if (target) {
        let n = wrapIdx(baseIdx + target);
        if (n < 0 && target > 0) {
          await ensureAhead();
          n = wrapIdx(baseIdx + target);
          if (n < 0 && items.length > 1 && exhausted) {
            circular = true;
            n = wrapIdx(baseIdx + target);
          }
        } else if (n < 0 && target < 0 && items.length > 1 && exhausted) {
          circular = true;
          n = wrapIdx(baseIdx + target);
        }
        if (n < 0) {
          animateShift(shift, 0, SLIDE_BACK_MS, easeOutSine);
          return;
        }
        sliding = true;
        slideDir = target;
        if (MODE === "webcodecs" && wc && n >= 0) {
          const tIdle = performance.now();
          wc.presentIdle(items[n].id, true);
          slog("idle-cost", (performance.now() - tIdle).toFixed(1) + "ms", "id=" + items[n].id);
        }
        animateShift(shift, target, SLIDE_FLICK_MS, easeOutSine);
        ensureWindow();
      } else {
        animateShift(shift, 0, SLIDE_BACK_MS, easeOutSine);
      }
    }
    feedEl.addEventListener("pointerdown", function (e) {
      if (e.button && e.button !== 0) return;
      if ((e.target.closest && e.target.closest(".mute, .like, .bigplay, a, header")) || hitUiControl(e.clientX, e.clientY)) return;
      if (sliding) return;
      drag = {
        id: e.pointerId, y: e.clientY, lastY: e.clientY,
        t: performance.now(), lastT: performance.now(), vy: 0, moved: false
      };
      try { feedEl.setPointerCapture(e.pointerId); } catch (err) {}
    });
    feedEl.addEventListener("pointermove", function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      const now = performance.now();
      const dy = e.clientY - drag.y;
      const dt = now - drag.lastT;
      if (dt > 0) drag.vy = (e.clientY - drag.lastY) / dt;
      drag.lastY = e.clientY;
      drag.lastT = now;
      if (!drag.moved && Math.abs(dy) < 8) return;
      drag.moved = true;
      ignoreClick = true;
      const H = feedEl.clientHeight || window.innerHeight;
      let sh = -dy / H;
      const idx = Math.max(0, idxOf(activeId));
      if (!circular) {
        if (idx <= 0 && sh < 0) sh *= 0.28;
        if (idx >= items.length - 1 && sh > 0) sh *= 0.28;
      }
      shift = sh;
      baseIdx = idx;
      applyTransforms(baseIdx, shift);
    });
    feedEl.addEventListener("pointerup", onPointerEnd);
    feedEl.addEventListener("pointercancel", onPointerEnd);
    feedEl.addEventListener("wheel", function (e) {
      e.preventDefault();
      if (sliding || performance.now() < wheelLock) return;
      if (e.deltaY > 12) { wheelLock = performance.now() + SLIDE_KEY_MS; step(1); }
      else if (e.deltaY < -12) { wheelLock = performance.now() + SLIDE_KEY_MS; step(-1); }
    }, { passive: false });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); step(1); }
      if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); step(-1); }
      if (e.key === " " && activeId) {
        e.preventDefault();
        togglePlayback(activeId);
      }
      if ((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        toggleMute();
        flashMuteHud();
      }
    });
    document.addEventListener("play", function (e) {
      if (!e.target || e.target.tagName !== "VIDEO") return;
      const slide = e.target.closest(".slide");
      if (slide) setSlideUi(slide.dataset.id);
    }, true);
    document.addEventListener("pause", function (e) {
      if (!e.target || e.target.tagName !== "VIDEO") return;
      const slide = e.target.closest(".slide");
      if (slide) setSlideUi(slide.dataset.id);
    }, true);

    async function main() {
      try {
        if (CHANNEL) {
          await loadChannelQueue();
        } else {
          if (START) {
            const v = await getJSON("/v1/videos/" + encodeURIComponent(START));
            if (v && v.id) append([v]);
          }
          await loadRandomPage();
        }
      } catch (e) {
        errEl.textContent = e.message;
      }
      if (!items.length) {
        feedEl.innerHTML = '<div class="empty">还没有短视频</div>';
        return;
      }
      const start = START && seen.has(START) ? START : items[0].id;
      activate(start);
      layoutNow();
    }
    window.addEventListener("resize", function () {
      layoutNow();
      document.querySelectorAll(".stage-box").forEach(function (box) {
        const media = box.querySelector("video, canvas.stage");
        if (!media) return;
        if (media.tagName === "VIDEO" && media.videoWidth) {
          fitStageBox(box, media.videoWidth, media.videoHeight);
        } else if (media.tagName === "CANVAS" && media.width) {
          fitStageBox(box, media.width, media.height);
        }
      });
    });
    async function boot() {
      if (window.mtMedia && window.mtMedia.ready) await window.mtMedia.ready();
      let want = qs.get("engine") || "";
      try {
        const site = await getJSON("/v1/public/site");
        if (!want) want = site.shortsEngine || "legacy";
      } catch (e) {
        slog("boot site-settings failed", e && e.message);
        if (!want) want = "legacy";
      }
      const can = typeof VideoDecoder === "function" && typeof AudioDecoder === "function";
      slog("boot-check", "want=" + want, "VideoDecoder=" + can);
      if (want === "webcodecs" && can) {
        MODE = "webcodecs";
        try {
          const mod = await import("/static/shorts-engine.js");
          wc = await mod.create({
            token: token(),
            getToken: token,
            onLog: slog,
            onError: function (msg, id) {
              if (isAbortErr(msg)) return;
              slog("engine-error", "id=" + id, msg);
              if (id && id !== activeId) {
                if (fwdK > 1) fwdK -= 1;
                return;
              }
              errEl.textContent = msg || "播放失败";
            },
            onMuteChange: function () {},
            onUi: function (id) { if (id) setSlideUi(id); }
          });
          wc.setMuted(true);
        } catch (e) {
          slog("boot engine failed", e && e.message);
          MODE = "legacy";
          wc = null;
        }
        syncMuteButtons();
      }
      slog("boot", "mode=" + MODE, "want=" + want, "VideoDecoder=" + can, "wc=" + !!wc);
      setInterval(function () {
        if (wc && wc.logHot) {
          ensureWindow();
          return;
        }
        const skip = "sync skipped mode=" + MODE + " wc=" + !!wc;
        if (skip === lastHotSkip) return;
        lastHotSkip = skip;
        slog(skip);
      }, 200);
      if (!progRaf) tickProgress();
      await main();
    }
    boot();
  </script>
  <script src="/static/account.js"></script>
</body>
</html>
