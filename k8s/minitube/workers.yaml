apiVersion: apps/v1
kind: Deployment
metadata:
  name: minitube-worker-qsv-w2
  namespace: minitube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minitube-worker
      rank: "3"
  template:
    metadata:
      labels:
        app: minitube-worker
        rank: "3"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker2
      securityContext:
        supplementalGroups: [44, 109]
      containers:
        - name: worker
          image: minitube/worker-qsv:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: minitube
            - secretRef:
                name: minitube
          env:
            - name: TRANSCODE_ENCODER
              value: h264_qsv
            - name: LIBVA_DRIVER_NAME
              value: iHD
            - name: TRANSCODE_PRESET
              value: medium
            - name: TRANSCODE_RANK
              value: "3"
            - name: TRANSCODE_MAX_HEIGHT
              value: "1080"
            - name: TRANSCODE_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - export DATABASE_URL="postgres://minitube:${POSTGRES_PASSWORD}@minitube-pg:5432/minitube?sslmode=disable"; exec /usr/local/bin/minitube-worker
          resources:
            limits:
              gpu.intel.com/i915: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
              gpu.intel.com/i915: "1"
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: minitube-media
