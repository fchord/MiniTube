apiVersion: v1
kind: Service
metadata:
  name: minitube-pg
  namespace: minitube-test
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: minitube-pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minitube-pg
  namespace: minitube-test
spec:
  serviceName: minitube-pg
  replicas: 1
  selector:
    matchLabels:
      app: minitube-pg
  template:
    metadata:
      labels:
        app: minitube-pg
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: minitube
            - name: POSTGRES_DB
              value: minitube
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minitube
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "minitube", "-d", "minitube"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pg
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pg
          hostPath:
            path: /data/minitube-pg-test
            type: DirectoryOrCreate
