apiVersion: v1
kind: Service
metadata:
  name: minitube-api
  namespace: minitube-test
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30818
  selector:
    app: minitube-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minitube-api
  namespace: minitube-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minitube-api
  template:
    metadata:
      labels:
        app: minitube-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: api
          image: minitube/api:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 8081
          envFrom:
            - configMapRef:
                name: minitube
            - secretRef:
                name: minitube
          command: ["/bin/sh", "-c"]
          args:
            - export DATABASE_URL="postgres://minitube:${POSTGRES_PASSWORD}@minitube-pg:5432/minitube?sslmode=disable"; exec /usr/local/bin/minitube-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            timeoutSeconds: 3
            periodSeconds: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: minitube-media
