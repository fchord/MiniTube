# Smoke tests — apply after plugins are Ready, delete when done.
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-nvidia
  namespace: default
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: k8s-worker2
  containers:
    - name: cuda
      # Already present on NVIDIA nodes (same as the device plugin). nvidia-smi
      # comes from the host driver via RuntimeClass nvidia.
      image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-intel-worker1
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1
  containers:
    - name: dri
      image: busybox:1.36
      command: ["sh", "-c", "ls -l /dev/dri; echo OK"]
      resources:
        limits:
          gpu.intel.com/i915: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-intel-worker2
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-worker2
  containers:
    - name: dri
      image: busybox:1.36
      command: ["sh", "-c", "ls -l /dev/dri; echo OK"]
      resources:
        limits:
          gpu.intel.com/i915: 1
